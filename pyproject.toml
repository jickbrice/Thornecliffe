[project]
name = "thornecliffe"
version = "1.0.0"
description = "A low-cost dataset and harness for studying LLM misalignment under RL."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Jick Brice", email = "jickbrice@proton.me" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.7",
    "transformers>=5.20.2",
    "peft>=0.21.2",
    "accelerate>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thornecliffe"]

# CUDA build of PyTorch from the official index on Windows and Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
